services:
  db:
    image: postgres:18-alpine
    container_name: helpdesk-db
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 guarda los datos bajo /var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
